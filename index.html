<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Входящие заявки</title>
  <style>
    body { max-width: 40rem; margin: 2rem auto; padding: 0 1rem; font: 1rem/1.5 system-ui, sans-serif; }
    textarea { box-sizing: border-box; display: block; width: 100%; margin: .5rem 0; padding: .5rem; font: inherit; }
    button { padding: .4rem .8rem; font: inherit; }
    pre { white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Входящие заявки</h1>
  <form>
    <label for="message">Текст заявки</label>
    <textarea id="message" rows="4"></textarea>
    <button type="submit">Разобрать заявку</button>
  </form>
  <section id="result" aria-live="polite">
    <p id="notice"></p>
    <div id="ready" hidden>
      <p><strong>Тема:</strong> <span id="topic"></span></p>
      <p><strong>Черновик ответа</strong> (проверьте перед отправкой клиенту):</p>
      <pre id="draft"></pre>
    </div>
  </section>
  <script type="module">
    const TOPIC_LABELS = { delivery: "Доставка", pricing: "Цены и стоимость", other: "Другое" };
    const form = document.querySelector("form");
    const button = form.querySelector("button");
    const message = document.querySelector("#message");
    const notice = document.querySelector("#notice");
    const ready = document.querySelector("#ready");
    const topic = document.querySelector("#topic");
    const draft = document.querySelector("#draft");
    let lastRequest = 0;

    function show(text, result = null) {
      notice.textContent = text;
      // A previous draft must never stay on screen next to a new failure.
      topic.textContent = result ? TOPIC_LABELS[result.topic] ?? result.topic : "";
      draft.textContent = result ? result.draft : "";
      ready.hidden = !result;
    }

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (message.value.trim() === "") {
        show("Введите текст заявки.");
        return;
      }
      const id = ++lastRequest;
      show("Разбираю заявку…");
      button.disabled = true;
      let body = null;
      try {
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text: message.value }),
        });
        body = await reply.json();
      } catch {
        body = null;
      }
      if (id !== lastRequest) return; // a newer request owns the screen
      button.disabled = false;
      if (body?.status === "ready") show("", body);
      else if (body?.status === "invalid_input") show("Введите текст заявки.");
      else show("AI не смог разобрать эту заявку. Разберите её вручную: определите тему и напишите ответ сами.");
    });
  </script>
</body>
</html>
